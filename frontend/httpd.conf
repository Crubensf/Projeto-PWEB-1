ServerRoot "/usr/local/apache2"

# Módulos necessários
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so

# Módulos de proxy (para redirecionar /api/ → backend)
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

# Módulos SSL
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

# Módulo de unixd (necessário no Linux)
LoadModule unixd_module modules/mod_unixd.so

ServerName localhost
ServerAdmin webmaster@localhost

# Logs
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined

# Tipos MIME básicos
TypesConfig conf/mime.types

# Arquivo índice padrão
DirectoryIndex index.html

# ── Virtual Host HTTP (porta 80) — redireciona tudo para HTTPS ──
Listen 80
<VirtualHost *:80>
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ── Virtual Host HTTPS (porta 443) ──
Listen 443
<VirtualHost *:443>
    DocumentRoot "/usr/local/apache2/htdocs"
    ServerName localhost

    # Configuração SSL
    SSLEngine on
    SSLCertificateFile    /usr/local/apache2/conf/ssl/server.crt
    SSLCertificateKeyFile /usr/local/apache2/conf/ssl/server.key

    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        HIGH:!aNULL:!MD5:!RC4
    SSLHonorCipherOrder   on

    # Headers de segurança
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # ── Proxy reverso: /api/ → backend FastAPI ──
    ProxyPreserveHost On
    ProxyPass        /api/ http://backend:8000/api/
    ProxyPassReverse /api/ http://backend:8000/api/

    # Não aplica proxy no restante (arquivos estáticos servidos pelo Apache)
    ProxyPass        / !

    # Permissão de acesso ao diretório de arquivos estáticos
    <Directory "/usr/local/apache2/htdocs">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Fallback: qualquer rota desconhecida serve index.html (SPA-style)
    # Para este projeto as páginas são .html separadas, então não é necessário,
    # mas deixamos comentado caso queira usar no futuro.
    # FallbackResource /index.html
</VirtualHost>
