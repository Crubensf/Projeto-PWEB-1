<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.basemaps.cartocdn.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 http://localhost:8001 http://127.0.0.1:8001 https://nominatim.openstreetmap.org https://router.project-osrm.org; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acesso • Van Já</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css?v=7">
  <link rel="stylesheet" href="./css/login.css?v=7">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#15803D" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1410" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/imagens/van.png">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body class="login-bg">
  <main class="login-container" role="main">
    <a class="login-voltar" href="index.html">← Voltar para a página inicial</a>

    <section class="login-card" aria-labelledby="titulo-login">
      <header class="login-card-header">
        <img class="login-logo" src="imagens/van.png" alt="Van Já" />
        <h1 id="titulo-login">Acesso Van Já</h1>
        <p class="login-sub">Entre na sua conta para ver as rotas.</p>
      </header>

      <!-- initLogin() usa .login-form, name="email" e name="senha" -->
      <form class="login-form" action="/sessao" method="post" novalidate>
        <div class="login-campo">
          <label for="email">Seu e-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="exemplo@email.com"
            required>
          <small class="msg-erro" aria-live="polite"></small>
        </div>

        <div class="login-campo">
          <label for="senha">Sua senha</label>
          <input
            id="senha"
            name="senha"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
            minlength="6">
          <small class="msg-erro" aria-live="polite"></small>
        </div>

        <div class="login-aux">
          <a class="link esqueci-senha" href="/recuperar-senha">Esqueci minha senha</a>
        </div>

        <button class="botao botao-primario botao-login" type="submit">Entrar</button>

        <p class="criar-conta">
          Não tem conta? <a class="link" href="cadastrar.html">Cadastre-se</a>
        </p>
      </form>
    </section>
  </main>

  <!-- Script principal da aplicação -->
  <script src="js/utils.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
</body>
</html>
