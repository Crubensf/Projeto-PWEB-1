<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.basemaps.cartocdn.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 http://localhost:8001 http://127.0.0.1:8001 https://nominatim.openstreetmap.org https://router.project-osrm.org; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rotas disponíveis hoje • Van Já</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css?v=7">
  <link rel="stylesheet" href="./css/rotas.css?v=7">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#15803D" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1410" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/imagens/van.png">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body class="page-rotas">
 
  <header class="cabecalho-site" role="banner">
    <div class="caixa caixa--header linha-cabecalho">
      <a class="marca" href="index.html" aria-label="Van Já — Página inicial">
        <span class="marca-ponto" aria-hidden="true"></span>
        Van&nbsp;Já
      </a>

      <nav class="navegacao" aria-label="Principal">
        <a href="index.html#rotas">Rotas</a>
        <a href="index.html#ajuda">Ajuda</a>
      </nav>

      <div class="acoes-header">
        <a class="botao botao-ghost" href="login.html" id="btn-login-link">Entrar</a>
        <a class="botao botao-primario" href="cadastrar.html" id="btn-cadastrar-link">Cadastrar</a>
        <a id="btn-painel-usuario" class="botao botao-primario" href="painel.html" style="display:none">Meu painel</a>
        <button type="button" class="botao botao-invertido" id="btn-sair" style="display:none">Sair</button>
      </div>
    </div>
  </header>

  <main id="conteudo">
    
    <section class="faixa-filtros" aria-label="Filtros de busca">
      <div class="caixa filtros-wrap">
        <div class="grupo-input">
          <label for="origem">Saindo de</label>
          <input id="origem" type="text" placeholder="Digite a origem (ex.: Picos)">
        </div>

        <div class="grupo-input">
          <label for="destino">Indo para</label>
          <input id="destino" type="text" placeholder="Digite o destino (ex.: Oeiras)">
        </div>

        <button class="botao botao-primario botao-buscar" type="button" id="btnNovaBusca">
          Nova busca
        </button>
      </div>
    </section>

    <section class="secao topo-lista">
      <div class="caixa">
        <h1 class="titulo-lista" id="tituloLista">Rotas disponíveis hoje</h1>

        <div class="dias" role="tablist" aria-label="Filtrar por dia da semana">
          <button class="chip-dia" role="tab" aria-selected="false">Domingo</button>
          <button class="chip-dia" role="tab" aria-selected="false">Segunda</button>
          <button class="chip-dia" role="tab" aria-selected="false">Terça</button>
          <button class="chip-dia" role="tab" aria-selected="false">Quarta</button>
          <button class="chip-dia" role="tab" aria-selected="false">Quinta</button>
          <button class="chip-dia" role="tab" aria-selected="false">Sexta</button>
          <button class="chip-dia" role="tab" aria-selected="false">Sábado</button>
        </div>

        <div class="filtros-avancados" role="group" aria-label="Filtros avançados">
          <label>
            <span>Preço de R$</span>
            <input type="number" id="filtro-preco-min" min="0" step="10" placeholder="0">
          </label>
          <label>
            <span>até R$</span>
            <input type="number" id="filtro-preco-max" min="0" step="10" placeholder="∞">
          </label>
          <label>
            <span>Saída entre</span>
            <input type="time" id="filtro-hora-min">
          </label>
          <label>
            <span>e</span>
            <input type="time" id="filtro-hora-max">
          </label>
          <label>
            <span>Ordenar por</span>
            <select id="filtro-ordenar">
              <option value="recentes">Mais recentes</option>
              <option value="preco_asc">Preço (menor)</option>
              <option value="preco_desc">Preço (maior)</option>
              <option value="hora_asc">Horário de saída</option>
            </select>
          </label>
        </div>
      </div>
    </section>

    <section class="secao mapa-secao" aria-label="Mapa das rotas">
      <div class="caixa">
        <div id="mapa-rotas" class="mapa-listagem" role="application" hidden></div>
      </div>
    </section>

    <section class="secao resultados" aria-labelledby="tituloLista">
      <div class="caixa lista-resultados">

        <!-- rotas virão do backend futuramente -->

        <p class="sem-resultados">
          Nenhuma rota encontrada para os filtros selecionados.
        </p>

      </div>

      <div class="caixa carregar-mais-wrap">
        <p class="resumo-paginacao" id="resumo-paginacao"></p>
        <button type="button" id="btn-carregar-mais" class="botao botao-suave" hidden>
          Carregar mais
        </button>
      </div>
    </section>
  </main>

  <footer class="rodape-site" role="contentinfo">
    <div class="caixa">
      <p>© 2025 Van Já.</p>
    </div>
  </footer>

  <dialog id="modal-reservar" aria-labelledby="modal-reservar-titulo">
    <form method="dialog" id="form-reservar">
      <h2 id="modal-reservar-titulo">Reservar viagem</h2>
      <p class="modal-rota-nome" id="modal-rota-nome"></p>
      <p class="modal-rota-dias" id="modal-rota-dias"></p>

      <label for="modal-data">Data da viagem</label>
      <input type="date" id="modal-data" required>

      <p class="modal-erro" id="modal-erro" role="alert" hidden></p>

      <menu class="modal-acoes">
        <button type="button" id="modal-cancelar" class="botao botao-suave">Cancelar</button>
        <button type="submit" id="modal-confirmar" class="botao botao-primario">Confirmar</button>
      </menu>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="js/utils.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
  <script src="js/mapa-listagem.js?v=7"></script>
</body>
</html>
